{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="form-card">
    <h2 class="mb-4">Student Registration</h2>
    <form method="POST">
        <div class="mb-3"><label class="form-label">Name</label><input name="name" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Register Number</label><input name="register_number" class="form-control" required></div>
        <div class="mb-3">
            <label class="form-label">Department</label>
            <select name="department" class="form-select" required>
                <option value="">Select Department</option>
                <option>CSE</option><option>ECE</option><option>EEE</option>
                <option>MECH</option><option>CIVIL</option><option>IT</option><option>Other</option>
            </select>
        </div>
        <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" minlength="6" required></div>
        <button class="btn btn-primary w-100">Register</button>
    </form>
</div>
{% endblock %}
